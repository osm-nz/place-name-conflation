name: Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: ⏬ Checkout code
        uses: actions/checkout@v6

      - name: ⏬ Enable Corepack
        run: corepack enable

      - name: 🔢 Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: ⏬ Install
        run: |
          yarn

      - name: ✨ Lint
        run: |
          yarn lint

      - name: 🧪 Test
        run: |
          yarn test
